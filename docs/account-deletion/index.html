<style>
  :root { --fg:#16202b; --mut:#5b6b7b; --line:#e3e9ef; --bg:#fff; --acc:#0f6b52; --soft:#f4f7f9; --warn:#8a4b00; --warnbg:#fff7ec; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic",sans-serif; }
  .wrap { max-width:46rem; margin:0 auto; padding:2rem 1.25rem 5rem; }
  header { border-bottom:1px solid var(--line); padding-bottom:1.25rem; margin-bottom:2rem; }
  h1 { font-size:1.65rem; margin:0 0 .35rem; letter-spacing:-.01em; }
  .app { color:var(--acc); font-weight:600; }
  .meta { color:var(--mut); font-size:.85rem; margin:0; }
  h2 { font-size:1.12rem; margin:2.25rem 0 .5rem; letter-spacing:-.01em; }
  p, li { margin:.4rem 0; }
  ol, ul { padding-inline-start:1.25rem; margin:.4rem 0; }
  a { color:var(--acc); }
  .langs { display:flex; flex-wrap:wrap; gap:.4rem; margin:1rem 0 0; }
  .langs button { font:inherit; font-size:.82rem; padding:.3rem .7rem; cursor:pointer;
                  border:1px solid var(--line); border-radius:999px; background:var(--soft); color:var(--fg); }
  .langs button[aria-pressed="true"] { background:var(--acc); border-color:var(--acc); color:#fff; }
  .note { background:var(--soft); border-inline-start:3px solid var(--acc);
          padding:.75rem 1rem; border-radius:0 6px 6px 0; margin:1rem 0; font-size:.93rem; }
  .warn { background:var(--warnbg); border-inline-start:3px solid var(--warn);
          padding:.75rem 1rem; border-radius:0 6px 6px 0; margin:1rem 0; font-size:.93rem; }
  .card { border:1px solid var(--line); border-radius:8px; padding:1rem 1.15rem; margin:1rem 0; }
  .card h3 { margin:0 0 .35rem; font-size:1rem; }
  .tag { display:inline-block; font-size:.72rem; letter-spacing:.03em; text-transform:uppercase;
         background:var(--acc); color:#fff; border-radius:999px; padding:.1rem .5rem; vertical-align:middle; }
  table { width:100%; border-collapse:collapse; margin:.75rem 0; font-size:.92rem; }
  th,td { text-align:start; border:1px solid var(--line); padding:.5rem .6rem; vertical-align:top; }
  th { background:var(--soft); font-weight:600; }
  .btn { display:inline-block; margin-top:.5rem; padding:.55rem 1rem; border-radius:6px;
         background:var(--acc); color:#fff; text-decoration:none; font-weight:600; font-size:.93rem; }
  footer { margin-top:3rem; padding-top:1.25rem; border-top:1px solid var(--line);
           color:var(--mut); font-size:.85rem; }
  @media print { .langs, .btn { display:none; } body { font-size:12pt; } }
</style>
</head>
<body>

    <nav class="langs" id="langs" aria-label="Language / Dil"></nav>

  <footer id="foot"></footer>

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s،]+)/g, function(u){
    return '<a href="'+u+'" rel="noopener">'+u+'</a>';
  });
}

function render(lang){
  var t = T[lang] || T.tr;
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;
  document.getElementById("title").textContent = t.title;
  document.getElementById("meta").textContent = t.meta;
  document.title = "Nefs Zikirleri — " + t.title;

  var out = '<p class="note">'+linkify(t.intro)+'</p>';
  out += '<div class="warn"><strong>'+esc(t.warnTitle)+'.</strong> '+linkify(t.warn)+'</div>';

  t.ways.forEach(function(w){
    out += '<div class="card"><h3><span class="tag">'+esc(w.tag)+'</span> &nbsp;'+esc(w.h)+'</h3><ol>'
         + w.steps.map(function(s){ return '<li>'+linkify(s)+'</li>'; }).join('')
         + '</ol>';
    if (w === t.ways[1]) {
      out += '<a class="btn" href="mailto:'+CONTACT_EMAIL
           + '?subject='+encodeURIComponent('Account deletion request — Nefs Zikirleri')
           +'">'+esc(CONTACT_EMAIL)+'</a>';
    }
    out += '</div>';
  });

  out += '<h2>'+esc(t.hWhat)+'</h2><table><thead><tr>'
       + t.tbl.head.map(function(h){ return '<th>'+esc(h)+'</th>'; }).join('')
       + '</tr></thead><tbody>'
       + t.tbl.rows.map(function(r){ return '<tr>'+r.map(function(c){ return '<td>'+esc(c)+'</td>'; }).join('')+'</tr>'; }).join('')
       + '</tbody></table>';

  out += '<h2>'+esc(t.hNote)+'</h2><ul>'
       + t.note.slice(0,-1).map(function(x){ return '<li>'+linkify(x)+'</li>'; }).join('')
       + '<li>'+linkify(t.note[t.note.length-1])+' <a href="'+PRIVACY_PATH+'">'+esc(t.dir==="rtl"?"سياسة الخصوصية":(lang==="en"?"Privacy Policy":(lang==="de"?"Datenschutzerklärung":(lang==="fr"?"Politique de confidentialité":"Gizlilik Politikası"))))+'</a></li>'
       + '</ul>';

  out += '<h2>'+esc(t.hContact)+'</h2><p><a href="mailto:'+CONTACT_EMAIL+'">'+esc(CONTACT_EMAIL)+'</a></p>';

  document.getElementById("body").innerHTML = out;
  document.getElementById("foot").textContent = t.foot;

  Array.prototype.forEach.call(document.querySelectorAll("#langs button"), function(b){
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false");
  });
  try { localStorage.setItem("nefs_deletion_lang", lang); } catch(e){}
}

(function(){
  var nav = document.getElementById("langs");
  LANGS.forEach(function(l){
    var b = document.createElement("button");
    b.type = "button";
    b.dataset.lang = l;
    b.textContent = T[l].name;
    b.addEventListener("click", function(){ render(l); });
    nav.appendChild(b);
  });
  var saved = null;
  try { saved = localStorage.getItem("nefs_deletion_lang"); } catch(e){}
  var guess = saved || (navigator.language || "tr").slice(0,2).toLowerCase();
  render(LANGS.indexOf(guess) >= 0 ? guess : "tr");
})();
</script>
</body>
</html>
