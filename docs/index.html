<style>
  :root { --fg:#16202b; --mut:#5b6b7b; --line:#e3e9ef; --bg:#fff; --acc:#0f6b52; --soft:#f4f7f9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic",sans-serif; }
  .wrap { max-width:46rem; margin:0 auto; padding:2rem 1.25rem 5rem; }
  header { border-bottom:1px solid var(--line); padding-bottom:1.25rem; margin-bottom:2rem; }
  h1 { font-size:1.75rem; margin:0 0 .35rem; letter-spacing:-.02em; }
  .app { color:var(--acc); font-weight:700; font-size:1.05rem; margin:.15rem 0; }
  .meta { color:var(--mut); font-size:.85rem; margin:0; }

  p, li { margin:.4rem 0; }
  ul { padding-inline-start:1.25rem; margin:.4rem 0; }
  a { color:var(--acc); }
  .langs { display:flex; flex-wrap:wrap; gap:.4rem; margin:1rem 0 0; }
  .langs button { font:inherit; font-size:.82rem; padding:.3rem .7rem; cursor:pointer;
                  border:1px solid var(--line); border-radius:999px; background:var(--soft); color:var(--fg); }
  .langs button[aria-pressed="true"] { background:var(--acc); border-color:var(--acc); color:#fff; }
  .note { background:var(--soft); border-inline-start:3px solid var(--acc);
          padding:.75rem 1rem; border-radius:0 6px 6px 0; margin:1rem 0; font-size:.93rem; }
  .grid { display:grid; gap:1rem; grid-template-columns:1fr; margin:1.25rem 0; }
  @media(min-width:600px){ .grid{ grid-template-columns:1fr 1fr; } }
  .card { border:1px solid var(--line); border-radius:10px; padding:1rem 1.15rem; background:#fff; }
  .card h3 { margin:0 0 .35rem; font-size:1.02rem; }
  .card p { margin:.25rem 0 .6rem; font-size:.92rem; color:var(--mut); }
  .btn { display:inline-block; padding:.5rem .9rem; border-radius:6px;
         background:var(--acc); color:#fff; text-decoration:none; font-weight:600; font-size:.9rem; }
  .btn.sec { background:var(--soft); color:var(--fg); border:1px solid var(--line); }
  footer { margin-top:3rem; padding-top:1.25rem; border-top:1px solid var(--line);

  .mono { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.85em; }

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s،]+)/g, function(u){
    return '<a href="'+u+'" rel="noopener">'+u+'</a>';
  });
}

function render(lang){
  var t = T[lang] || T.tr;
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;
  document.getElementById("title").textContent = t.title;
  document.getElementById("meta").textContent = t.meta;
  document.title = t.title + " — " + (lang==="tr"?"Ana Sayfa":lang==="en"?"Home":lang==="de"?"Startseite":lang==="fr"?"Accueil":"الرئيسية");

  var out = '<p class="note">'+esc(t.intro)+'</p>';
  out += '<h2>'+esc(t.hPages)+'</h2>';
  out += '<div class="grid">';
  t.cards.forEach(function(c){
    out += '<div class="card"><h3>'+esc(c.h)+'</h3><p>'+esc(c.p)+'</p><a class="btn" href="'+esc(c.href)+'">'+esc(c.btn)+'</a></div>';
  });
  out += '</div>';

  out += '<h2>'+esc(t.hAbout)+'</h2><ul>';
  t.about.forEach(function(x){ out += '<li>'+esc(x)+'</li>'; });
  out += '</ul>';

  out += '<h2>'+esc(t.hInfo)+'</h2><ul>';
  t.info.forEach(function(x){ out += '<li>'+linkify(x)+'</li>'; });
  out += '</ul>';

  out += '<h2>'+esc(t.hContact)+'</h2><p>'+esc(t.contact)+'<a href="mailto:'+CONTACT_EMAIL+'">'+esc(CONTACT_EMAIL)+'</a></p>';

  document.getElementById("body").innerHTML = out;
  document.getElementById("foot").textContent = t.foot;

  Array.prototype.forEach.call(document.querySelectorAll("#langs button"), function(b){
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false");
  });
  try { localStorage.setItem("nefs_home_lang", lang); } catch(e){}
}

(function(){
  var nav = document.getElementById("langs");
  LANGS.forEach(function(l){
    var b = document.createElement("button");
    b.type = "button";
    b.dataset.lang = l;
    b.textContent = T[l].name;
    b.addEventListener("click", function(){ render(l); });
    nav.appendChild(b);
  });
  var saved = null;
  try { saved = localStorage.getItem("nefs_home_lang"); } catch(e){}
  var guess = saved || (navigator.language || "tr").slice(0,2).toLowerCase();
  render(LANGS.indexOf(guess) >= 0 ? guess : "tr");
})();
