function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s،]+)/g, function(u){
    return '<a href="'+u+'" rel="noopener">'+u+'</a>';
  });
}

function render(lang){
  var t = T[lang] || T.tr;
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;
  document.getElementById("title").textContent = t.title;
  document.getElementById("meta").textContent = t.meta;
  document.title = "Nefs Zikirleri — " + t.title;

  var out = '<p class="note">'+linkify(t.intro)+'</p>';
  t.sec.forEach(function(s){
    out += '<h2>'+esc(s.h)+'</h2>';
    if (s.p)  s.p.forEach(function(x){ out += '<p>'+linkify(x)+'</p>'; });
    if (s.li) out += '<ul>'+s.li.map(function(x){ return '<li>'+linkify(x)+'</li>'; }).join('')+'</ul>';
    if (s.p2) s.p2.forEach(function(x){ out += '<p>'+linkify(x)+'</p>'; });
    if (s.li2) out += '<ul>'+s.li2.map(function(x){ return '<li>'+linkify(x)+'</li>'; }).join('')+'</ul>';
    if (s.p3) s.p3.forEach(function(x){ out += '<p>'+linkify(x)+'</p>'; });
    if (s.tbl){
      out += '<table><thead><tr>'+s.tbl.head.map(function(h){ return '<th>'+esc(h)+'</th>'; }).join('')+'</tr></thead><tbody>'
           + s.tbl.rows.map(function(r){ return '<tr>'+r.map(function(c){ return '<td>'+esc(c)+'</td>'; }).join('')+'</tr>'; }).join('')
           + '</tbody></table>';
    }
  });
  // Iletisim bolumune e-posta baglantisi eklenir
  out += '<p><a href="mailto:'+CONTACT_EMAIL+'">'+esc(CONTACT_EMAIL)+'</a></p>';
  document.getElementById("body").innerHTML = out;
  document.getElementById("foot").textContent = t.foot;

  Array.prototype.forEach.call(document.querySelectorAll("#langs button"), function(b){
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false");
  });
  try { localStorage.setItem("nefs_privacy_lang", lang); } catch(e){}
}

(function(){
  var nav = document.getElementById("langs");
  LANGS.forEach(function(l){
    var b = document.createElement("button");
    b.type = "button";
    b.dataset.lang = l;
    b.textContent = T[l].name;
    b.addEventListener("click", function(){ render(l); });
    nav.appendChild(b);
  });
  var saved = null;
  try { saved = localStorage.getItem("nefs_privacy_lang"); } catch(e){}
  var guess = saved || (navigator.language || "tr").slice(0,2).toLowerCase();
  render(LANGS.indexOf(guess) >= 0 ? guess : "tr");
})();
</script>
