name: Build Release AAB & APK

on:
  workflow_dispatch: # Manual trigger for official releases

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Create missing env files
      run: |
        touch .env.example
        touch .env

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Run Android Lint
      run: ./gradlew lintDebug --no-daemon

    - name: Extract Version Info
      id: version_info
      run: |
        VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
        VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | head -n 1 | awk '{print $3}')
        if [ -z "$VERSION_NAME" ]; then
          VERSION_NAME="release"
        fi
        echo "APP_VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
        echo "APP_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
        echo "Building release for version: $VERSION_NAME ($VERSION_CODE)"

    - name: Validate Release Signing Secrets
      run: |
        MISSING_SECRETS=0
        if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "::error::Secret 'KEYSTORE_BASE64' is missing or empty."
          MISSING_SECRETS=1
        fi
        if [ -z "${{ secrets.STORE_PASSWORD }}" ]; then
          echo "::error::Secret 'STORE_PASSWORD' is missing or empty."
          MISSING_SECRETS=1
        fi
        if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
          echo "::error::Secret 'KEY_ALIAS' is missing or empty."
          MISSING_SECRETS=1
        fi
        if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
          echo "::error::Secret 'KEY_PASSWORD' is missing or empty."
          MISSING_SECRETS=1
        fi
        if [ $MISSING_SECRETS -eq 1 ]; then
          echo "Critical signing configuration missing. Aborting release build." >&2
          exit 1
        fi

    - name: Materialize Release Keystore
      env:
        ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$ENCODED_KEYSTORE" | base64 -di > ${{ github.workspace }}/release.keystore
        chmod 600 ${{ github.workspace }}/release.keystore

    - name: Build Signed Release AAB and APK
      env:
        RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
        RELEASE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew bundleRelease assembleRelease --no-daemon

    - name: Validate Generated Release Artifacts
      run: |
        AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
        APK_PATH="app/build/outputs/apk/release/app-release.apk"

        if [ ! -s "$AAB_PATH" ]; then
          echo "::error::Signed Release AAB was not generated or is empty at $AAB_PATH"
          exit 1
        fi

        if [ ! -s "$APK_PATH" ]; then
          echo "::error::Signed Release APK was not generated or is empty at $APK_PATH"
          exit 1
        fi

        echo "AAB File Size: $(du -h $AAB_PATH | cut -f1)"
        echo "APK File Size: $(du -h $APK_PATH | cut -f1)"

    - name: Secure Cleanup Keystore
      if: always()
      run: |
        rm -f ${{ github.workspace }}/release.keystore

    - name: Upload Release AAB (For Google Play)
      uses: actions/upload-artifact@v4
      with:
        name: Nefs-Zikirleri-v${{ env.APP_VERSION_NAME }}-Release-AAB
        path: app/build/outputs/bundle/release/app-release.aab
        if-no-files-found: error
        retention-days: 30

    - name: Upload Release APK (For Direct Distribution)
      uses: actions/upload-artifact@v4
      with:
        name: Nefs-Zikirleri-v${{ env.APP_VERSION_NAME }}-Release-APK
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
        retention-days: 30

