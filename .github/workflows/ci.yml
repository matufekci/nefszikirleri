name: CI - Build & Test & Room Schema

on:
  push:
    branches: [ main, arena/** ]
  pull_request:
    branches: [ main ]

# Aynı dal için push + pull_request çift tetikleme çakışmasın:
# iki event da aynı concurrency grubuna düşer (pull_request'te head_ref,
# push'ta ref_name = dal adı), ikincisi birinciyi iptal eder ve dal başına
# tek aktif run kalır. Yeni push, eski in-progress run'ı da iptal eder.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare google-services.json (gercek Firebase yapilandirmasi)
        run: bash .github/scripts/prepare-google-services.sh

      - name: Create .env from example for CI
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi
          if [ ! -f app/.env ] && [ -f app/.env.example ]; then cp app/.env.example app/.env; fi
          if [ ! -f .env ] && [ -f app/.env.example ]; then cp app/.env.example .env; fi
          ls -la .env 2>&1 || true
          cat .env

      - name: Check Room schema exists
        run: |
          echo "Checking Room schemas..."
          ls -la app/schemas/com.example.data.local.AppDatabase/ || echo "No schemas folder yet"
          if [ ! -f app/schemas/com.example.data.local.AppDatabase/8.json ]; then
            echo "WARNING: Latest Room schema 8.json missing"
          fi

      - name: Run unit tests (Robolectric)
        run: ./gradlew testDebugUnitTest --stacktrace --continue 2>&1 | tee unit-test.log
        continue-on-error: true

      - name: Report unit test results
        if: always()
        run: ./.github/scripts/report-unit-tests.sh app/build/test-results/testDebugUnitTest
        continue-on-error: true

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace 2>&1 | tee lint.log
        continue-on-error: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/
            app/build/test-results/
            unit-test.log
            lint.log

  build-debug:
    runs-on: ubuntu-latest
    if: always()
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare google-services.json (gercek Firebase yapilandirmasi)
        run: bash .github/scripts/prepare-google-services.sh

      - name: Create .env from example for CI
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi
          if [ ! -f app/.env ] && [ -f app/.env.example ]; then cp app/.env.example app/.env; fi
          ls -la .env 2>&1 || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build-debug.log
        continue-on-error: true

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/output-metadata.json
            build-debug.log

      - name: Fail loudly if no APK was produced
        if: always()
        run: ./.github/scripts/assert-apk.sh app/build/outputs/apk/debug build-debug.log debug-apk

      - name: Report APK signing certificate (Firebase SHA-1 kaniti)
        if: always()
        run: bash .github/scripts/report-apk-signer.sh

  build-apk-only:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare google-services.json (gercek Firebase yapilandirmasi)
        run: bash .github/scripts/prepare-google-services.sh

      - name: Create .env from example
        run: |
          cp .env.example .env
          cat .env

      - name: Build debug APK (no tests)
        run: ./gradlew assembleDebug -x test --stacktrace 2>&1 | tee build-apk-only.log
        continue-on-error: true

      # Log/artifact depolari erisilemez oldugunda derleyici hatalari
      # annotation olarak da gorunur (check-runs API'sinden okunabilir).
      - name: Derleyici hatalarini annotation olarak bildir
        if: always()
        run: |
          if [ -f build-apk-only.log ]; then
            grep -E "^e: " build-apk-only.log | head -30 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-no-tests
          path: |
            app/build/outputs/apk/debug/*.apk
            build-apk-only.log

      - name: Fail loudly if no APK was produced
        if: always()
        run: ./.github/scripts/assert-apk.sh app/build/outputs/apk/debug build-apk-only.log debug-apk-no-tests

      - name: Report APK signing certificate (Firebase SHA-1 kaniti)
        if: always()
        run: bash .github/scripts/report-apk-signer.sh

  release-build:
    # Release yolu (R8 minify + shrinkResources) CI'da HIC denenmemisti.
    # Obfuscation/kaynak daraltma hatalari yalnizca release derlemesinde ortaya
    # cikar; yani debug yesilken release cokuyor olabilirdi. Bu job bunu kapatir.
    # Imza icin repodaki sabit debug.keystore kullanilir: boylece cikan APK
    # kurulabilir ve Google girisi ayni SHA-1 ile calisir. Play'e cikacak
    # surumde gercek release anahtari ortam degiskenleriyle verilmelidir.
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare google-services.json (gercek Firebase yapilandirmasi)
        run: bash .github/scripts/prepare-google-services.sh

      - name: Create .env from example
        run: |
          cp .env.example .env

      - name: Build release APK (R8 + kaynak daraltma)
        env:
          # Mutlak yol sart: file(...) app modulune gore cozumlenir.
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          RELEASE_STORE_PASSWORD: android
          RELEASE_KEY_ALIAS: androiddebugkey
          RELEASE_KEY_PASSWORD: android
        run: ./gradlew assembleRelease --stacktrace 2>&1 | tee build-release.log
        continue-on-error: true

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            build-release.log

      - name: Fail loudly if no release APK was produced
        if: always()
        run: ./.github/scripts/assert-apk.sh app/build/outputs/apk/release build-release.log release-apk

      - name: Report release APK signing certificate (Firebase SHA-1 kaniti)
        if: always()
        run: bash .github/scripts/report-apk-signer.sh app/build/outputs/apk/release/app-release.apk
